[workspace]
resolver = "2"
members = [
  "crates/bempic-model",
  "crates/bempic-codec",
  "crates/bempic-sync",
  "crates/bempic-store",
  "crates/bempic-carrier",
  "crates/bempic-sim",
  "crates/bempic-cli",
  "crates/bempic-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gordonfive/bempic-reference"
rust-version = "1.81"

[workspace.dependencies]
bempic-model = { path = "crates/bempic-model", version = "0.1.0" }
bempic-codec = { path = "crates/bempic-codec", version = "0.1.0" }
bempic-sync = { path = "crates/bempic-sync", version = "0.1.0" }
bempic-store = { path = "crates/bempic-store", version = "0.1.0" }
bempic-carrier = { path = "crates/bempic-carrier", version = "0.1.0" }
bempic-sim = { path = "crates/bempic-sim", version = "0.1.0" }
hex = "=0.4.3"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
tempfile = "=3.12.0"
thiserror = "=1.0.64"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
