name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p bempic-conformance --release
      - run: cargo run -p bempic-conformance --release -- tranche2-measurements
      - run: cargo run -p bempic-conformance --release -- verify-compact-codec-evidence
      - run: cargo run -p bempic-conformance --release -- verify-tranche3-evidence
      - run: cargo run -p bempic-cli -- demo
      - run: cargo run -p bempic-bench --release

  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-conformance.txt
      - run: python scripts/verify_conformance.py
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s prototype/tests -v
      - run: python -m prototype.demo
      - run: python -m prototype.benchmark
